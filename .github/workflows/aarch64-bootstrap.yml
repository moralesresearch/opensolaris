name: AArch64 bootstrap image

on:
  push:
    branches: [master]
    tags: ['arm64-v*']
    paths:
      - '.github/workflows/aarch64-bootstrap.yml'
      - 'usr/src/Makefile'
      - 'usr/src/Makefile.master'
      - 'usr/src/uts/Makefile*'
      - 'usr/src/uts/common/sys/**'
      - 'usr/src/uts/common/os/**'
      - 'usr/src/uts/common/io/**'
      - 'usr/src/uts/common/vm/**'
      - 'usr/src/uts/common/disp/**'
      - 'usr/src/uts/arm64/**'
      - 'usr/src/uts/arm64pc/**'
  pull_request:
    paths:
      - '.github/workflows/aarch64-bootstrap.yml'
      - 'usr/src/Makefile'
      - 'usr/src/Makefile.master'
      - 'usr/src/uts/Makefile*'
      - 'usr/src/uts/common/sys/**'
      - 'usr/src/uts/common/os/**'
      - 'usr/src/uts/common/io/**'
      - 'usr/src/uts/common/vm/**'
      - 'usr/src/uts/common/disp/**'
      - 'usr/src/uts/arm64/**'
      - 'usr/src/uts/arm64pc/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install cross-build and emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang lld llvm make qemu-system-arm

      - name: Build, inspect, and boot the image
        run: |
          make -C usr/src/uts/arm64pc clean all check smoke-all dist

      - name: Create checksums
        run: |
          cd build/arm64pc
          sha256sum \
            opensolaris-aarch64.elf \
            opensolaris-aarch64.img \
            opensolaris-aarch64.map \
            opensolaris-aarch64-qemu-virt.tar.gz \
            > SHA256SUMS

      - name: Upload boot images
        uses: actions/upload-artifact@v4
        with:
          name: opensolaris-aarch64-qemu-virt
          if-no-files-found: error
          path: |
            build/arm64pc/opensolaris-aarch64.elf
            build/arm64pc/opensolaris-aarch64.img
            build/arm64pc/opensolaris-aarch64.map
            build/arm64pc/opensolaris-aarch64-qemu-virt.tar.gz
            build/arm64pc/SHA256SUMS

  publish:
    if: startsWith(github.ref, 'refs/tags/arm64-v')
    needs: build-and-boot
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified images
        uses: actions/download-artifact@v4
        with:
          name: opensolaris-aarch64-qemu-virt
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "OpenSolaris AArch64 bootstrap $GITHUB_REF_NAME" \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
