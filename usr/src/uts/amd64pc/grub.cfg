#
# GRUB 2 menu for the OpenSolaris x86_64 (amd64pc) install medium.
# The same file drives BIOS (El Torito no-emulation) and UEFI boots.
#
set timeout=3
set default=0

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial

# Hand the kernel a linear framebuffer on UEFI (GOP) as well as on BIOS,
# so machines without a serial port still get a console.
if [ "${grub_platform}" = "efi" ]; then
	insmod efi_gop
	insmod efi_uga
else
	insmod vbe
fi
insmod all_video
set gfxpayload=keep

menuentry "OpenSolaris x86_64 bootstrap (amd64pc)" {
	insmod multiboot2
	echo "Loading /platform/amd64pc/kernel/amd64/unix ..."
	multiboot2 /platform/amd64pc/kernel/amd64/unix console=ttya,text
	boot
}

menuentry "Reboot" {
	reboot
}
